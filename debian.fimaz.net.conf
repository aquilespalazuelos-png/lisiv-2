<VirtualHost *:80>

	ServerAdmin debian@uas.edu.mx
	ServerName debian.fimaz.net
	ServerAlias debian.fimaz.net

	DocumentRoot /home/debian/public_html/

        <Directory />
                Options FollowSymLinks
                AllowOverride None
        </Directory>
        <Directory /home/debian/public_html/>
                Options Indexes FollowSymLinks MultiViews
                AllowOverride All
                <LimitExcept GET POST PUT DELETE PATCH OPTIONS>
                        Require all granted
                </LimitExcept>
                Order allow,deny
                allow from all
        </Directory>

	ErrorLog ${APACHE_LOG_DIR}/debian.fimaz.net.log
	CustomLog ${APACHE_LOG_DIR}/debian.fimaz.net-access.log combined

</VirtualHost>
