ServerName                      "ProFTPD Docker Server"
ServerType                      standalone
DefaultServer                   on
UseIPv6                         off
MasqueradeAddress               148.227.3.233

Port                            21
Umask                           000 000
MaxInstances                    30

#User                            nobody
#Group                           nogroup

DefaultRoot                     ~
RequireValidShell               off

PassivePorts                    30000 30009

AuthUserFile                    /etc/proftpd/ftpusers

SystemLog                       /var/log/proftpd/proftpd.log
TransferLog                     /var/log/proftpd/xfer.log


AllowOverwrite on
AllowStoreRestart on
AllowRetrieveRestart on
